name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONUTF8: '1'
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Declared minimum numerical dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: python -m pip install "numpy==1.23.5" "scipy==1.10.1"
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - name: Echelle reference and rejected coarse scan
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pytest -q -m slow
      - run: python -m pip check
      - run: python -m gratingbem --version
      - run: python -m gratingbem inspect examples/rectangle_demo.json
