[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gratingbem"
version = "0.1.0a1"
description = "2D periodic Maxwell boundary integral calculations for bare grating profiles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Maxwell", "boundary integral", "gratings", "echelle", "Nyström"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/yyyyy-9/GratingBEM"
Issues = "https://github.com/yyyyy-9/GratingBEM/issues"
Documentation = "https://github.com/yyyyy-9/GratingBEM/blob/main/docs/zh/quickstart.md"

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.6"]

[project.scripts]
gratingbem = "gratingbem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gratingbem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: integration checks (opt-in using -m slow)"]
